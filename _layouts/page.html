---
layout: default
---
<div class="page-content">
  <div class="container">
    <header>
      <h1 class="page-title">{{ page.title }}</h1>
      {% if page.subtitle %}<p class="page-subtitle">{{ page.subtitle }}</p>{% endif %}
    </header>
    {% if page.archival_note %}
    <p class="archival-note">{{ page.archival_note }}</p>
    {% endif %}
    <article>
      {{ content }}
    </article>
    {% if page.tags %}
    <div class="tag-list">
      {% for tag in page.tags %}<span class="tag">#{{ tag }}</span>{% endfor %}
    </div>
    {% endif %}
  </div>
</div>
