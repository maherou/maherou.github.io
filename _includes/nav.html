<header class="site-header">
  <div class="container">
    <a class="site-brand" href="{{ '/' | relative_url }}">
      {{ site.author }}
      <span>{{ site.tagline }}</span>
    </a>
    <input type="checkbox" id="nav-toggle" class="nav-toggle">
    <label for="nav-toggle" class="nav-toggle-label" aria-label="Toggle navigation">&#9776;</label>
    <nav class="site-nav">
      <ul>
        {% for item in site.nav %}
        {% if item.external %}
        <li><a href="{{ item.url }}" target="_blank" rel="noopener">{{ item.title }}</a></li>
        {% else %}
        <li><a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a></li>
        {% endif %}
        {% endfor %}
      </ul>
    </nav>
  </div>
</header>
